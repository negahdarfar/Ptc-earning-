services:
  earnorbit:
    build: .
    container_name: earnorbit
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/earnorbit.db
      ENVIRONMENT: production
      EARNORBIT_API_TOKEN: ${EARNORBIT_API_TOKEN:?Set EARNORBIT_API_TOKEN in the host environment or .env file}
    volumes:
      - earnorbit_data:/data
    restart: unless-stopped
volumes:
  earnorbit_data:
